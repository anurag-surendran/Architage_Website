<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Architage</title><meta name="description" content="Call, WhatsApp or send your plot details to Architage."><meta name="theme-color" content="#1C2A06">
<link rel="icon" href="assets/img/favicon.png"><link rel="preload" href="assets/data/catalog.json" as="fetch" crossorigin>
<link rel="stylesheet" href="assets/css/site.css"><style>
.c-head{padding:56px 0 48px;display:grid;grid-template-columns:1fr 460px;gap:64px;align-items:end}
.c-head h1{font-size:76px;color:var(--forest)}.c-head p{color:var(--muted);font-size:18px}
.contact-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:32px;margin-bottom:112px}
.cbox{background:var(--forest);color:var(--lime);border-radius:10px;padding:40px}
.cbox h2{font-size:34px;margin-bottom:24px}
.crow{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line-lt)}
.crow svg{width:22px;height:22px;color:var(--teak-lt)}
.crow small{display:block;font-size:13px;color:rgba(237,239,230,.6)}
.crow b{font-weight:500;font-size:19px}
.crow .go{margin-left:auto;font-size:14px;color:var(--teak-lt);font-weight:500}
.crow:hover b{text-decoration:underline}
.hours{margin-top:24px;font-size:15px;color:rgba(237,239,230,.75)}
.fbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:40px}
.fbox h2{font-size:34px;color:var(--forest)}.fbox>p{color:var(--muted);margin:8px 0 28px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;height:52px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 16px;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.fgrid textarea{height:120px;padding:14px 16px;resize:vertical}
.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(58,82,2,.15)}
.ferr{color:var(--laterite);margin-top:14px;font-size:15px}
.fdone{margin-top:20px;background:#E6EBD3;border-radius:10px;padding:20px 22px}
.fdone b{display:block;font:400 22px Marcellus;color:var(--forest)}
.fdone p{color:var(--muted);font-size:15px;margin:4px 0 14px}
@media (max-width:1000px) and (min-width:601px){.contact-grid{grid-template-columns:1fr}.c-head{grid-template-columns:1fr;gap:16px}}
@media (max-width:600px){.contact-grid{grid-template-columns:1fr}.c-head{grid-template-columns:1fr;gap:14px;padding:16px 0 28px}.c-head h1{font-size:42px}.cbox,.fbox{padding:26px 20px}.fgrid{grid-template-columns:1fr}.contact-grid{margin-bottom:64px}}</style></head>
<body data-page="contact"><a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main"><div class="loading" aria-live="polite"><span></span>Loading</div></main>
<div id="site-footer"></div>
<script src="assets/js/site.js" defer></script>
<script src="assets/js/catalog.js" defer></script>
</body></html>
